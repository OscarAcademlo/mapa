<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización de Ubicación</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        var map = L.map('map').setView([-41.133472, -71.310278], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var marker;
        var polyline = L.polyline([], { color: 'blue' }).addTo(map);
        var latLngs = [];

        function updateMap(lat, lon) {
            if (marker) {
                marker.setLatLng([lat, lon]);
            } else {
                marker = L.marker([lat, lon]).addTo(map).bindPopup('Ubicación Actual').openPopup();
            }
            map.setView([lat, lon], 13);
            latLngs.push([lat, lon]);
            polyline.setLatLngs(latLngs);
        }

        function startTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    function (position) {
                        var lat = position.coords.latitude;
                        var lon = position.coords.longitude;
                        updateMap(lat, lon);
                    },
                    function (error) {
                        console.error('Error al obtener la ubicación:', error);
                        alert('Error al obtener la ubicación.');
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 2000 }
                );
            } else {
                alert('Geolocalización no soportada.');
            }
        }

        function setupMap() {
            const params = new URLSearchParams(window.location.search);
            const lat = parseFloat(params.get('lat'));
            const lon = parseFloat(params.get('lon'));
            const destLat = parseFloat(params.get('destLat'));
            const destLon = parseFloat(params.get('destLon'));
            const track = params.get('track') === 'true';

            console.log("Parámetros recibidos:", { lat, lon, destLat, destLon, track });

            if (lat && lon) {
                updateMap(lat, lon);

                if (destLat && destLon) {
                    L.marker([destLat, destLon]).addTo(map).bindPopup('Destino').openPopup();
                    L.polyline([[lat, lon], [destLat, destLon]], { color: 'green', weight: 4 }).addTo(map);
                }

                if (track) {
                    startTracking();
                }
            } else {
                startTracking();
            }
        }

        setupMap();
    </script>
</body>
</html>
